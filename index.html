<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
    <title>Tic Tac Toe</title>
</head>

<body>
    <h1>TIC TAC TOE</h1>
    <div class="taskbar"><button class="newGameBtn">NEW GAME</button></div>
    <div class="display">Let's play tic tac toe with a friend!!</div>
    <div class="board">
        <div class="cell" id="0"> </div>
        <div class="cell" id="1"> </div>
        <div class="cell" id="2"> </div>
        <div class="cell" id="3"> </div>
        <div class="cell" id="4"> </div>
        <div class="cell" id="5"> </div>
        <div class="cell" id="6"> </div>
        <div class="cell" id="7"> </div>
        <div class="cell" id="8"> </div>
    </div>
    <footer>
        <div class="player1">
            <input type="text" class="name1" value="Player 1">            </input>
            <input type="text" maxlength="5" class="mark1" value="X">
            <p class="score1"></p><p> point(s)</p>
        </div>
        <div class="player2">
            <input type="text" class="name2" value="Player 2">            </input>
            <input type="text" maxlength="5" class="mark2" value="O">
            <p class="score2"></p><p> point(s)</p>
        </div>
        <button class="changeInfo">CHANGE PLAYER INFO</button>
    </footer>
</body>

</html>
