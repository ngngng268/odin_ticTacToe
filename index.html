<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
    <title>Tic Tac Toe</title>
</head>

<body>
    <h1>TIC TAC TOE</h1>
    <div class="taskbar"><button class="newGameBtn">NEW GAME</button></div>
    <div class="display">placeholder</div>
    <div class="board">
        <div class="cell" id="0"> </div>
        <div class="cell" id="1"> </div>
        <div class="cell" id="2"> </div>
        <div class="cell" id="3"> </div>
        <div class="cell" id="4"> </div>
        <div class="cell" id="5"> </div>
        <div class="cell" id="6"> </div>
        <div class="cell" id="7"> </div>
        <div class="cell" id="8"> </div>
    </div>
    <footer>
        <div class="player1">
            <p class="name1">Player 1</p>
            <p class="mark1">Mark</p>
            <p class="score1">score</p>
        </div>
        <div class="player2">
            <p class="name2">Player 1</p>
            <p class="mark2">Mark</p>
            <p class="score2">score</p>
        </div>
    </footer>
</body>

</html>
